name: build-release

# Manually (workflow_dispatch) or by pushing the release tag: the tag pattern
# is v<version of package.json>, e.g. v9.3.0. A tag whose name does not match
# the version in package.json stops the run before anything is built.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build_release_body.sh needs tags and history

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Read addon version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "error: tag ${{ github.ref_name }} does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Build addon packages
        env:
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh

      - name: End-to-end test (x86_64 package)
        run: test/e2e.sh dist

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          artifacts: dist/*
          bodyFile: RELEASE_BODY.md
          tag: "v${{ steps.version.outputs.version }}"
          commit: ${{ github.sha }}
